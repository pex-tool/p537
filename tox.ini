[tox]
minversion = 3.26.0
isolated_build = true
skip_missing_interpreters = true

envlist =
    py36
    py37
    py38
    py39
    py310
    py311
    py312
    py313
    py314
    py315
    py316

[testenv]
# We need newer Pip to operate under Python 3.14.
download = true

deps =
    pytest==6.2.5; python_version == "3.6"
    pytest==7.4.4; python_version == "3.7"
    pytest==8.3.3; python_version >= "3.8"

commands = pytest -vs

[testenv:package]
deps =
    auditwheel
    setuptools
    wheel
commands =
    python package.py

