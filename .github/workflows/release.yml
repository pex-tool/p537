name: Release
on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to manually run a deploy for.
        required: true
jobs:
  org-check:
    name: Check GitHub Organization
    if: ${{ github.repository_owner == 'pex-tool' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Noop
        run: "true"
  determine-tag:
    name: Determine the release tag to operate against.
    needs: org-check
    runs-on: ubuntu-24.04
    outputs:
      release-tag: ${{ steps.determine-tag.outputs.release-tag }}
      release-version: ${{ steps.determine-tag.outputs.release-version }}
    steps:
      - name: Determine Tag
        id: determine-tag
        run: |
          if [[ -n "${{ github.event.inputs.tag }}" ]]; then
            RELEASE_TAG=${{ github.event.inputs.tag }}
          else
            RELEASE_TAG=${GITHUB_REF#refs/tags/}
          fi
          if [[ "${RELEASE_TAG}" =~ ^v[0-9]+.[0-9]+.[0-9]+$ ]]; then
            echo "release-tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
            echo "release-version=${RELEASE_TAG#v}" >> $GITHUB_OUTPUT
          else
            echo "::error::Release tag '${RELEASE_TAG}' must match 'v\d+.\d+.\d+'."
            exit 1
          fi
  package-36-38-and-316-dists:
    name: ${{ matrix.os }} Package for Python ${{ matrix.python-version[0] }}.${{ matrix.python-version[1] }}
    needs: determine-tag
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
        python-version: [[3, 6, 15], [3, 7, 17], [3, 8, 18], [3, 16, "0a1"]]
    steps:
      - name: Checkout p537 ${{ needs.determine-tag.outputs.release-tag }}
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.determine-tag.outputs.release-tag }}
      - name: Install Python Build Deps
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -y \
            build-essential \
            curl \
            git \
            libbz2-dev \
            libffi-dev \
            liblzma-dev \
            libncursesw5-dev \
            libreadline-dev \
            libsqlite3-dev \
            libssl-dev \
            libxml2-dev \
            libxmlsec1-dev \
            libzstd-dev \
            make \
            tk-dev \
            xz-utils \
            zlib1g-dev
      - name: Install Pyenv
        run: |
          cd "${RUNNER_TOOL_CACHE}"
          git clone https://github.com/pyenv/pyenv
          (
            cd pyenv
            src/configure
            make -C src
          )
          export PYENV_ROOT="$PWD/pyenv"
          echo "PYENV_ROOT=${PYENV_ROOT}" >> "${GITHUB_ENV}"
          echo "${PYENV_ROOT}/bin" >> "${GITHUB_PATH}"
      - name: Setup Python ${{ join(matrix.python-version, '.') }}
        run: |
          pyenv install ${{ join(matrix.python-version, '.') }}
          echo "${PYENV_ROOT}/versions/${{ join(matrix.python-version, '.') }}/bin" >> "${GITHUB_PATH}"
      - name: Package ${{ needs.determine-tag.outputs.release-tag }}
        run: |
          alias python='python${{ matrix.python-version[0] }}.${{ matrix.python-version[1] }}'
          python -V
          python -mpip install -U pip
          python -mpip install -U tox
          python -mtox -e package
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.os }}-${{ needs.determine-tag.outputs.release-tag }}-${{ join(matrix.python-version, '.') }}-distributions"
          path: dist/
          retention-days: 1
  package-39-315-dists:
    name: ${{ matrix.os }} Package for Python ${{ matrix.python-version[0] }}.${{ matrix.python-version[1] }}
    needs: determine-tag
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        python-version: [[3, 9], [3, 10], [3, 11], [3, 12], [3, 13], [3, 14], [3, 15]]
    steps:
      - name: Checkout p537 ${{ needs.determine-tag.outputs.release-tag }}
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.determine-tag.outputs.release-tag }}
      - name: Setup Python ${{ join(matrix.python-version, '.') }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "${{ join(matrix.python-version, '.') }}"
      - name: Package ${{ needs.determine-tag.outputs.release-tag }}
        uses: pex-tool/actions/run-tox@7d8530c74d2e3ca4640d1ed9192b6e2b8c4f5f7b
        with:
          tox-env: package
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.os }}-${{ needs.determine-tag.outputs.release-tag }}-${{ join(matrix.python-version, '.') }}-distributions"
          path: dist/
          retention-days: 1
  pypi:
    name: Publish sdist and wheel to PyPI
    needs:
      - determine-tag
      - package-36-38-and-316-dists
      - package-39-315-dists
    runs-on: ubuntu-24.04
    environment: Release
    permissions:
      id-token: write
    steps:
      - name: Download all packaged distributions
        uses: actions/download-artifact@v5
        with:
          path: dist/
      - name: Re-organize distributions for upload
        run: |
          mv -v dist/ubuntu-24.04-${{ needs.determine-tag.outputs.release-tag }}-3.13-distributions/*.tar.gz dist/
          mv -v dist/*-distributions/*.whl dist/
          rm -rf dist/*-distributions
      - name: Publish p537 ${{ needs.determine-tag.outputs.release-tag }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          print-hash: true
          verbose: true

