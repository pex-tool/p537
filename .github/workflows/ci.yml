name: CI
on:
  pull_request:
  push:
    branches: main
defaults:
  run:
    shell: bash
concurrency:
  group: CI-${{ github.ref }}
  # Queue on all branches and tags, but only cancel overlapping PR burns.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' || !startsWith(github.ref, 'refs/tags/') }}
jobs:
  org-check:
    name: Check GitHub Organization
    if: github.repository_owner == 'pex-tool'
    runs-on: ubuntu-24.04
    steps:
      - name: Noop
        run: "true"
  tests-36-37:
    name: (${{ matrix.os }}) Python ${{ matrix.python-version[0] }}.${{ matrix.python-version[1] }} Tests
    needs: org-check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-13]
        python-version: [[3, 6, 15], [3, 7, 17]]
    steps:
      - name: Checkout p537
        uses: actions/checkout@v5
      - name: "Setup Python ${{ join(matrix.python-version, '.') }}"
        # Upgrade node16 -> node20: Out for review here:
        #   https://github.com/gabrielfalcao/pyenv-action/pull/444
        uses: pex-tool/pyenv-action@baec18679698d2f80064cc04eb9ad0c8dc5ca8f8
        env:
          ENSUREPIP: no
        with:
          default: "${{ join(matrix.python-version, '.') }}"
          command: pip install -U tox
      - name: Run Unit Tests
        run: tox -e py${{ matrix.python-version[0] }}${{ matrix.python-version[1] }}
  tests-38-316:
    name: (${{ matrix.os }}) Python 3.8 - 3.16 Tests
    needs: org-check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - name: Checkout p537
        uses: actions/checkout@v5
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.1"
      - name: Setup Pythons
        shell: bash
        run: |
          export UV_PYTHON_INSTALL_DIR="${PWD}/uv-pythons"
          uv python install --managed-python --force 3.{8..16}
          uv python list \
            --only-installed \
            --managed-python \
            --output-format json 2>/dev/null | \
              jq -r '.[] | .path' | \
              grep uv-pythons/ | \
              xargs dirname | while read entry; do
                echo "$(realpath "${entry}")" >> "${GITHUB_PATH}"
              done
      - name: Run Unit Tests
        uses: pex-tool/actions/run-tox@7d8530c74d2e3ca4640d1ed9192b6e2b8c4f5f7b
        with:
          tox-env: py38,py39,py310,py311,py312,py313,py314,py315,py316
  final-status:
    name: Gather Final Status
    needs:
      - tests-36-37
      - tests-38-316
    runs-on: ubuntu-24.04
    steps:
      - name: Check Non-Success
        if: |
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'skipped')
        run: "false"
      - name: Success
        run: "true"
