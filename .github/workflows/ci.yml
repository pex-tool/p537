name: CI
on:
  pull_request:
  push:
    branches: main
defaults:
  run:
    shell: bash
concurrency:
  group: CI-${{ github.ref }}
  # Queue on all branches and tags, but only cancel overlapping PR burns.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' || !startsWith(github.ref, 'refs/tags/') }}
jobs:
  org-check:
    name: Check GitHub Organization
    if: github.repository_owner == 'pex-tool'
    runs-on: ubuntu-24.04
    steps:
      - name: Noop
        run: "true"
  tests-36-38-and-316:
    name: (${{ matrix.os }}) Python ${{ matrix.python-version[0] }}.${{ matrix.python-version[1] }} Tests
    needs: org-check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
        python-version: [[3, 6, 15], [3, 7, 17], [3, 8, 18], [3, 16, "0a1"]]
    steps:
      - name: Checkout p537
        uses: actions/checkout@v7.0.1
      - name: Install Python Build Deps
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -y \
            build-essential \
            curl \
            git \
            libbz2-dev \
            libffi-dev \
            liblzma-dev \
            libncursesw5-dev \
            libreadline-dev \
            libsqlite3-dev \
            libssl-dev \
            libxml2-dev \
            libxmlsec1-dev \
            libzstd-dev \
            make \
            tk-dev \
            xz-utils \
            zlib1g-dev
      - name: Install Pyenv
        run: |
          cd "${RUNNER_TOOL_CACHE}"
          git clone https://github.com/pyenv/pyenv
          (
            cd pyenv
            src/configure
            make -C src
          )
          export PYENV_ROOT="$PWD/pyenv"
          echo "PYENV_ROOT=${PYENV_ROOT}" >> "${GITHUB_ENV}"
          echo "${PYENV_ROOT}/bin" >> "${GITHUB_PATH}"
      - name: Setup Python ${{ join(matrix.python-version, '.') }}
        run: |
          pyenv install ${{ join(matrix.python-version, '.') }}
          echo "${PYENV_ROOT}/versions/${{ join(matrix.python-version, '.') }}/bin" >> "${GITHUB_PATH}"
      - name: Setup Tox Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: 3.9
      - name: Run Unit Tests
        run: |
          python3.9 -V
          python3.9 -mpip install -U pip
          python3.9 -mpip install -U tox
          python3.9 -mtox -e py${{ matrix.python-version[0] }}${{ matrix.python-version[1] }} -- -vvs
  tests-39-315:
    name: (${{ matrix.os }}) Python 3.9 - 3.15 Tests
    needs: org-check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - name: Checkout p537
        uses: actions/checkout@v7.0.1
      - name: Setup Python 3.9
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.9"
      - name: Setup Python 3.10
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.10"
      - name: Setup Python 3.11
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - name: Setup Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Setup Python 3.13
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - name: Setup Python 3.14
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - name: Setup Python 3.15
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.15"
      - name: Run Unit Tests
        uses: pex-tool/actions/run-tox@main
        with:
          tox-env: py39,py310,py311,py312,py313,py314,py315
  final-status:
    name: Gather Final Status
    needs:
      - tests-36-38-and-316
      - tests-39-315
    runs-on: ubuntu-24.04
    steps:
      - name: Check Non-Success
        if: |
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'skipped')
        run: "false"
      - name: Success
        run: "true"
